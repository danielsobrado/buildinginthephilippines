<g font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#263446"><text x="55" y="648">• Factory steel reinforcement in AAC</text><text x="55" y="682">• Connectors and flexible joints need verification</text><text x="55" y="716">• No automatic site-cast RC at each opening</text><text x="747" y="648">• Vertical RC stiffeners beside opening</text><text x="747" y="682">• RC lintel above, bond beam below</text><text x="747" y="716">• Reinforced and anchored per engineer drawings</text></g><text x="700" y="767" text-anchor="middle" font-size="15" font-family="Arial,Helvetica,sans-serif" fill="#536170">CONCEPTUAL COMPARISON ONLY • NOT AN APPROVED STRUCTURAL DETAIL</text></svg>